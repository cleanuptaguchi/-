<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>勤怠打刻</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root {
    --ink: #1C2B2D;
    --sub: #5B6E6C;
    --bg: #FFFFFF;
    --card-bg: #EAF4F1;
    --working: #0F766E;
    --working-bg: #E1F2EF;
    --break: #B45309;
    --break-bg: #FBEEDD;
    --off: #6B7280;
    --off-bg: #EEEFF1;
    --danger: #B42318;
    --border: #DCE3E2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-tap-highlight-color: transparent;
  }
  .wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: 24px 20px 40px;
  }
  .header {
    text-align: center;
    margin-bottom: 20px;
  }
  .header .name {
    font-size: 15px;
    color: var(--sub);
  }
  .status-card {
    border-radius: 20px;
    padding: 32px 20px;
    text-align: center;
    background: var(--off-bg);
    border: 1px solid var(--border);
    transition: background 0.2s ease;
  }
  .status-card.working { background: var(--working-bg); }
  .status-card.onbreak { background: var(--break-bg); }
  .status-card .label {
    font-size: 14px;
    color: var(--sub);
    margin-bottom: 8px;
  }
  .status-card .status-text {
    font-size: 30px;
    font-weight: 700;
    color: var(--off);
  }
  .status-card.working .status-text { color: var(--working); }
  .status-card.onbreak .status-text { color: var(--break); }
  .status-card .time-text {
    margin-top: 10px;
    font-size: 14px;
    color: var(--sub);
  }
  .actions {
    margin-top: 28px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  button {
    font-family: inherit;
    border: none;
    border-radius: 14px;
    padding: 18px;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    width: 100%;
  }
  .btn-primary {
    background: var(--working);
    color: #FFFFFF;
  }
  .btn-primary.break-variant { background: var(--break); }
  .btn-secondary {
    background: #FFFFFF;
    color: var(--ink);
    border: 1px solid var(--border);
    font-weight: 500;
    font-size: 15px;
    padding: 14px;
  }
  button:disabled {
    opacity: 0.5;
    cursor: default;
  }
  .error-box {
    margin-top: 16px;
    padding: 12px 14px;
    border-radius: 10px;
    background: #FDECEA;
    color: var(--danger);
    font-size: 14px;
    display: none;
  }
  .loading {
    text-align: center;
    color: var(--sub);
    font-size: 15px;
    padding: 60px 0;
  }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <div id="loadingView" class="loading">読み込み中です…</div>

  <div id="mainView" class="hidden">
    <div class="header">
      <div class="name" id="staffName"></div>
    </div>

    <div class="status-card" id="statusCard">
      <div class="label">現在のステータス</div>
      <div class="status-text" id="statusText">-</div>
      <div class="time-text" id="statusTime"></div>
    </div>

    <div class="actions">
      <button class="btn-primary" id="primaryBtn"></button>
      <button class="btn-secondary hidden" id="secondaryBtn"></button>
    </div>

    <div class="error-box" id="errorBox"></div>
  </div>
</div>

<script>
// ==== 設定 ====
// GASのWebアプリを「デプロイ」した際に発行されるURLをここに設定する
const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxx3MgVsC1MI1SMWqimvCHhFdMvzOCtkIGmLcuRpeIQODhpU3OEL-R31dljviCC34Yq/exec";
// LINE Developersコンソールで発行したLIFF IDをここに設定する
const LIFF_ID = "2011535057-G3xrMYN6
";

let profile = null;
let currentStatus = "未出勤"; // 未出勤 / 勤務中 / 休憩中 / 退勤済

const STATUS_LABEL = {
  "未出勤": "未出勤",
  "勤務中": "勤務中",
  "休憩中": "休憩中",
  "退勤済": "退勤済み"
};

async function main() {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) {
      liff.login();
      return;
    }
    profile = await liff.getProfile();
    document.getElementById("staffName").textContent = profile.displayName;
    await refreshStatus();
  } catch (err) {
    showError("画面の読み込みに失敗しました。もう一度開き直してください。");
    console.error(err);
  } finally {
    document.getElementById("loadingView").classList.add("hidden");
    document.getElementById("mainView").classList.remove("hidden");
  }
}

async function refreshStatus() {
  const res = await fetch(`${GAS_WEB_APP_URL}?action=status&userId=${encodeURIComponent(profile.userId)}`);
  const data = await res.json();
  if (!data.ok) {
    showError(data.message || "ステータスの取得に失敗しました。");
    return;
  }
  currentStatus = data.status;
  renderStatus(data.status, data.lastTime);
}

function renderStatus(status, lastTime) {
  const card = document.getElementById("statusCard");
  card.classList.remove("working", "onbreak");
  if (status === "勤務中") card.classList.add("working");
  if (status === "休憩中") card.classList.add("onbreak");

  document.getElementById("statusText").textContent = STATUS_LABEL[status] || status;
  document.getElementById("statusTime").textContent = lastTime ? `最終更新: ${lastTime}` : "";

  const primaryBtn = document.getElementById("primaryBtn");
  const secondaryBtn = document.getElementById("secondaryBtn");
  primaryBtn.classList.remove("break-variant");
  secondaryBtn.classList.add("hidden");

  if (status === "未出勤" || status === "退勤済") {
    primaryBtn.textContent = "出勤する";
    primaryBtn.onclick = () => punch("clockIn");
  } else if (status === "勤務中") {
    primaryBtn.textContent = "退勤する";
    primaryBtn.onclick = () => punch("clockOut");
    secondaryBtn.textContent = "休憩に入る";
    secondaryBtn.classList.remove("hidden");
    secondaryBtn.onclick = () => punch("breakStart");
  } else if (status === "休憩中") {
    primaryBtn.classList.add("break-variant");
    primaryBtn.textContent = "休憩から戻る";
    primaryBtn.onclick = () => punch("breakEnd");
  }
}

async function punch(type) {
  hideError();
  setButtonsDisabled(true);
  try {
    const res = await fetch(GAS_WEB_APP_URL, {
      method: "POST",
      // GASのdoPostでCORSプリフライトを避けるためtext/plainで送る
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({
        userId: profile.userId,
        name: profile.displayName,
        type: type
      })
    });
    const data = await res.json();
    if (!data.ok) {
      showError(data.message || "打刻に失敗しました。もう一度お試しください。");
      return;
    }
    await refreshStatus();
  } catch (err) {
    showError("通信に失敗しました。電波の良い場所でもう一度お試しください。");
    console.error(err);
  } finally {
    setButtonsDisabled(false);
  }
}

function setButtonsDisabled(disabled) {
  document.getElementById("primaryBtn").disabled = disabled;
  document.getElementById("secondaryBtn").disabled = disabled;
}

function showError(msg) {
  const box = document.getElementById("errorBox");
  box.textContent = msg;
  box.style.display = "block";
}
function hideError() {
  document.getElementById("errorBox").style.display = "none";
}

main();
</script>
</body>
</html>
