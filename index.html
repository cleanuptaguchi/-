<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>勤怠打刻</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root {
    --ink: #1C2B2D;
    --sub: #5B6E6C;
    --bg: #FFFFFF;
    --card-bg: #EAF4F1;
    --working: #0F766E;
    --working-bg: #E1F2EF;
    --off: #6B7280;
    --off-bg: #EEEFF1;
    --danger: #B42318;
    --border: #DCE3E2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-tap-highlight-color: transparent;
  }
  .wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: 24px 20px 40px;
  }
  .header {
    text-align: center;
    margin-bottom: 20px;
  }
  .header .name {
    font-size: 15px;
    color: var(--sub);
  }
  .status-card {
    border-radius: 20px;
    padding: 32px 20px;
    text-align: center;
    background: var(--off-bg);
    border: 1px solid var(--border);
    transition: background 0.2s ease;
  }
  .status-card.working { background: var(--working-bg); }
  .status-card .label {
    font-size: 14px;
    color: var(--sub);
    margin-bottom: 8px;
  }
  .status-card .status-text {
    font-size: 30px;
    font-weight: 700;
    color: var(--off);
  }
  .status-card.working .status-text { color: var(--working); }
  .status-card .time-text {
    margin-top: 10px;
    font-size: 14px;
    color: var(--sub);
  }
  .actions {
    margin-top: 28px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  button {
    font-family: inherit;
    border: none;
    border-radius: 14px;
    padding: 18px;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    width: 100%;
  }
  .btn-primary {
    background: var(--working);
    color: #FFFFFF;
  }
  button:disabled {
    opacity: 0.5;
    cursor: default;
  }
  .error-box {
    margin-top: 16px;
    padding: 12px 14px;
    border-radius: 10px;
    background: #FDECEA;
    color: var(--danger);
    font-size: 14px;
    display: none;
  }
  .loading {
    text-align: center;
    color: var(--sub);
    font-size: 15px;
    padding: 60px 0;
  }
  .toast {
    margin-top: 16px;
    padding: 14px 16px;
    border-radius: 10px;
    background: var(--working-bg);
    color: var(--working);
    font-size: 15px;
    font-weight: 600;
    text-align: center;
  }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <div id="loadingView" class="loading">読み込み中です…</div>

  <div id="mainView" class="hidden">
    <div class="header">
      <div class="name" id="staffName"></div>
    </div>

    <div class="status-card" id="statusCard">
      <div class="label">現在のステータス</div>
      <div class="status-text" id="statusText">-</div>
      <div class="time-text" id="timeDetail"></div>
    </div>

    <div class="actions">
      <button class="btn-primary" id="primaryBtn"></button>
    </div>

    <div class="error-box" id="errorBox"></div>
    <div class="toast hidden" id="toast"></div>
  </div>
</div>

<script>
// ==== 設定 ====
const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwkd-Ek8L3X1cAvP3_yj97nGEm_vnlZnpjnXnElqiqp99QtXcFXZrsVOlxz8tk-QlYX/exec";
const LIFF_ID = "2011535057-G3xrMYN6";

let profile = null;
let currentStatus = "未出勤"; // 未出勤 / 勤務中 / 退勤済
let currentStartTime = null; 
let currentEndTime = null;   
let isSubmitting = false; 

// 打刻完了前の離脱防止ダイアログ
window.addEventListener("beforeunload", function (e) {
  if (isSubmitting) {
    e.preventDefault();
    e.returnValue = "データ送信中です。本当にこのページを離れますか？";
    return e.returnValue;
  }
});

const STATUS_LABEL = {
  "未出勤": "未出勤",
  "勤務中": "勤務中",
  "退勤済": "退勤済み"
};

async function main() {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) {
      liff.login();
      return;
    }
    profile = await liff.getProfile();
    document.getElementById("staffName").textContent = profile.displayName;
    await refreshStatus();
  } catch (err) {
    showError("画面の読み込みに失敗しました。もう一度開き直してください。");
    console.error(err);
  } finally {
    document.getElementById("loadingView").classList.add("hidden");
    document.getElementById("mainView").classList.remove("hidden");
  }
}

async function refreshStatus() {
  const cacheBuster = Date.now();
  const res = await fetch(
    `${GAS_WEB_APP_URL}?action=status&userId=${encodeURIComponent(profile.userId)}&_=${cacheBuster}`,
    { cache: "no-store" }
  );
  const data = await res.json();
  if (!data.ok) {
    showError(data.message || "ステータスの取得に失敗しました。");
    return;
  }
  currentStatus = data.status;
  currentStartTime = data.startTime;
  currentEndTime = data.endTime;
  renderStatus(data.status, data.startTime, data.endTime);
}

function renderStatus(status, startTime, endTime) {
  const card = document.getElementById("statusCard");
  card.classList.remove("working");
  if (status === "勤務中") card.classList.add("working");

  document.getElementById("statusText").textContent = STATUS_LABEL[status] || status;

  // 出勤・退勤時間の表示
  const timeDetail = document.getElementById("timeDetail");
  if (status === "退勤済" && startTime && endTime) {
    timeDetail.textContent = `出勤 ${startTime} 〜 退勤 ${endTime}`;
  } else if (status === "勤務中" && startTime) {
    timeDetail.textContent = `出勤 ${startTime} から勤務中`;
  } else {
    timeDetail.textContent = "";
  }

  const primaryBtn = document.getElementById("primaryBtn");

  // ステータスに応じたボタンの切り替え（出勤 または 退勤 のみ）
  if (status === "未出勤" || status === "退勤済") {
    primaryBtn.textContent = "出勤する";
    primaryBtn.onclick = () => punch("clockIn");
  } else if (status === "勤務中") {
    primaryBtn.textContent = "退勤する";
    primaryBtn.onclick = () => punch("clockOut");
  }
}

async function punch(type) {
  hideError();
  setButtonsDisabled(true);

  // 楽観的UI: 通信結果を待たず即座にメッセージ表示
  const label = type === "clockIn" ? "出勤" : "退勤";
  showToast(`${label}の打刻を受け付けました`);
  isSubmitting = true;

  try {
    const res = await fetch(GAS_WEB_APP_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({
        userId: profile.userId,
        name: profile.displayName,
        type: type
      })
    });
    const data = await res.json();

    if (!data.ok) {
      hideToast();
      alert(data.message || "打刻に失敗しました。再試行してください。");
      renderStatus(currentStatus, currentStartTime, currentEndTime);
      return;
    }

    // サーバーの返答メッセージ（GAS側で計算された実働・休憩時間など）があれば表示
    if (data.message) {
      showToast(data.message);
    }

    await refreshStatus();
    setTimeout(hideToast, 2500);
  } catch (err) {
    hideToast();
    alert("打刻に失敗しました。再試行してください。");
    renderStatus(currentStatus, currentStartTime, currentEndTime);
    console.error(err);
  } finally {
    isSubmitting = false;
    setButtonsDisabled(false);
  }
}

function showToast(msg) {
  const toast = document.getElementById("toast");
  toast.textContent = msg;
  toast.classList.remove("hidden");
}
function hideToast() {
  document.getElementById("toast").classList.add("hidden");
}

function setButtonsDisabled(disabled) {
  document.getElementById("primaryBtn").disabled = disabled;
}

function showError(msg) {
  const box = document.getElementById("errorBox");
  box.textContent = msg;
  box.style.display = "block";
}
function hideError() {
  document.getElementById("errorBox").style.display = "none";
}

main();
</script>
</body>
</html>
